# Free deploy on Render (https://render.com): New → Blueprint → pick this repo.
# The free plan wipes the disk on every restart, so app data lives in a free
# Postgres database (e.g. Neon: https://neon.tech). Paste its connection
# string into DATABASE_URL when Render asks.
services:
  - type: web
    name: ai-shorts
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:your-email, so push services can contact you
      - key: STORIES_PER_DAY
        value: "5"
      - key: EDITION_HOUR
        value: "8"
      - key: EDITION_TIMEZONE
        sync: false # e.g. Asia/Kolkata
